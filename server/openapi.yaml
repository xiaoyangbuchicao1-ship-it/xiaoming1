openapi: 3.1.0
info:
  title: 小明智能体任务 API
  version: 1.1.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 按创建顺序列出全部任务，包括已完成任务
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: 创建一条未完成任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
                dueDate: { $ref: "#/components/schemas/NullableDueDate" }
                priority: { $ref: "#/components/schemas/NullablePriority" }
                effort: { $ref: "#/components/schemas/NullableEffort" }
                subtasks:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/SubtaskInput" }
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 修改标题、完成状态或扩展属性
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                dueDate: { $ref: "#/components/schemas/NullableDueDate" }
                priority: { $ref: "#/components/schemas/NullablePriority" }
                effort: { $ref: "#/components/schemas/NullableEffort" }
                subtasks:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/SubtaskInput" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      summary: 删除一条任务
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    NullableDueDate:
      type: [string, "null"]
      format: date
      description: 截止日期（YYYY-MM-DD），传 null 可清除
    NullablePriority:
      type: [string, "null"]
      enum: [high, medium, low, null]
      description: 优先级，传 null 可清除
    NullableEffort:
      type: [string, "null"]
      enum: [small, medium, large, null]
      description: 工作量，传 null 可清除
    Subtask:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
    SubtaskInput:
      type: object
      required: [title]
      properties:
        id: { type: string }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
    Task:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        dueDate: { type: string, format: date }
        priority: { type: string, enum: [high, medium, low] }
        effort: { type: string, enum: [small, medium, large] }
        subtasks:
          type: array
          items: { $ref: "#/components/schemas/Subtask" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: 请求字段无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
